name: Update LeetCode Stats

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 🔑 THIS IS THE FIX
permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats and table
        run: |
          EASY=0
          MEDIUM=0
          HARD=0
          TOTAL=0

          TABLE="| # | Problem | Difficulty | Language |\n|---|---------|------------|----------|"

          for file in *.java; do
            TOTAL=$((TOTAL+1))
            NAME=$(basename "$file" .java)

            if [[ "$NAME" =~ ^[0-4] ]]; then
              DIFF="Easy"
              EASY=$((EASY+1))
            elif [[ "$NAME" =~ ^[5-12] ]]; then
              DIFF="Medium"
              MEDIUM=$((MEDIUM+1))
            else
              DIFF="Hard"
              HARD=$((HARD+1))
            fi

            TABLE="$TABLE\n| $TOTAL | $NAME | $DIFF | Java |"
          done

          echo -e "$TABLE" > table.md

          echo "{ \"schemaVersion\": 1, \"label\": \"Problems Solved\", \"message\": \"$TOTAL\", \"color\": \"brightgreen\" }" > badge-total.json
          echo "{ \"schemaVersion\": 1, \"label\": \"Easy\", \"message\": \"$EASY\", \"color\": \"success\" }" > badge-easy.json
          echo "{ \"schemaVersion\": 1, \"label\": \"Medium\", \"message\": \"$MEDIUM\", \"color\": \"orange\" }" > badge-medium.json
          echo "{ \"schemaVersion\": 1, \"label\": \"Hard\", \"message\": \"$HARD\", \"color\": \"red\" }" > badge-hard.json

      - name: Inject table into README
        run: |
          awk '
          BEGIN {found=0}
          /<!-- AUTO_TABLE_START -->/ {
            print;
            system("cat table.md");
            found=1;
            next
          }
          /<!-- AUTO_TABLE_END -->/ {
            print;
            found=0;
            next
          }
          found==0 { print }
          ' README.md > README.tmp
          mv README.tmp README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Auto update LeetCode stats" || exit 0
          git push
